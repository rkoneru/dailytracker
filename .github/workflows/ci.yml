name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The suites drive a real browser against the repository as served, so
      # there is nothing to build first — only a browser to fetch.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/.tmp/output/
          retention-days: 7
