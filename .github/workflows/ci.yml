name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The suites drive a real browser against the repository as served, so
      # there is nothing to build first — only a browser to fetch.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # The runner is on UTC — the one timezone where treating a UTC date as a
      # local one happens to give the right day. The date-sensitive suites run
      # again east of Greenwich, where that mistake starts weeks on a Sunday.
      - name: Test dates outside UTC
        run: node tests/run.js timezones edit-timeline history template-shape resources capacity
        env:
          TZ: Asia/Kolkata

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/.tmp/output/
          retention-days: 7
